<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · TATAOTALK</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f8fc;color:#252a38;font-family:Inter,"Pretendard","Noto Sans KR",Arial,sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,440px);padding:46px;background:white;border:1px solid #eceef3;border-radius:22px;box-shadow:0 18px 60px #252b3b10}.brand{display:flex;justify-content:center;align-items:center;gap:10px;color:#252b3b;font-size:14px;font-weight:850;letter-spacing:1.4px}.brand-mark{width:35px;height:35px;background:#5969e9;color:white;border-radius:12px;display:grid;place-items:center;letter-spacing:0}.card h1{text-align:center;font-size:26px;letter-spacing:-.8px;margin:28px 0 8px}.intro{text-align:center;color:#858b98;font-size:13px;margin:0 0 28px}.field{margin:17px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input{width:100%;height:47px;border:1px solid #e4e7ed;border-radius:10px;padding:0 13px;font-size:14px;outline:0}.field input:focus{border-color:#8791f1;box-shadow:0 0 0 3px #5969e914}.submit{width:100%;height:49px;margin-top:8px;border:0;border-radius:10px;background:#5969e9;color:white;font-size:14px;font-weight:750;cursor:pointer}.submit:hover{background:#4657db}.foot{text-align:center;color:#858b98;font-size:13px;margin:24px 0 0}.foot a{color:#5263e2;font-weight:700;text-decoration:none;margin-left:4px}.back{display:block;text-align:center;margin-top:17px;text-decoration:none;color:#969ba5;font-size:12px}@media(max-width:480px){.card{padding:36px 25px}}
</style></head><body><main class="card"><div class="brand"><span class="brand-mark">T</span>TATAOTALK</div><h1>다시 만나 반가워요</h1><p class="intro">로그인하고 친구들과 대화를 이어가세요.</p><form action="/login" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">아이디</label><input id="username" name="username" type="text" placeholder="아이디를 입력하세요" autocomplete="username" required autofocus></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required></div><button class="submit" type="submit">로그인</button></form><p class="foot">처음이신가요?<a href="/register">회원가입</a></p><a class="back" href="/">← 첫 화면으로</a></main></body></html>
