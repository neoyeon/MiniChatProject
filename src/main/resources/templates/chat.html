<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title th:text="${room.name}">
        채팅방
    </title>

    <style>

        html, body { height: 100%; }
        body { margin: 0; padding: 0 20px 12px; display: flex; flex-direction: column; overflow: hidden; font-family: Arial, sans-serif; }
        h1, hr, body > a, body > br { flex: 0 0 auto; }
        #messageArea { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: #fbfcfe; padding: 16px; }
        .message { display: flex; align-items: flex-end; gap: 7px; margin: 10px 0; color: #222; }
        .my-message { justify-content: flex-end; }
        .other-message { justify-content: flex-start; }
        .message-body { display: flex; flex-direction: column; max-width: 75%; }
        .my-message .message-body { align-items: flex-end; }
        .message-nickname { margin: 0 0 4px 2px; font-size: 12px; color: #333; }
        .message-bubble { padding: 9px 12px; border-radius: 4px; background: #fff; overflow-wrap: anywhere; }
        .my-message .message-bubble { background: #5969e9; color: #111; }
        .message-time { flex: none; margin-bottom: 2px; color: #555; font-size: 11px; }
        .date-divider { display: flex; align-items: center; gap: 14px; width: 100%; margin: 18px 0; color: #7e8592; font-size: 11px; white-space: nowrap; }
        .date-divider::before, .date-divider::after { content: ""; flex: 1; height: 1px; background: #dfe3ea; }
        .chat-input-area { display: flex; flex: 0 0 auto; position: sticky; bottom: 0; z-index: 2; gap: 8px; padding: 12px; border-top: 1px solid #edf0f4; background: #fff; }
        .chat-input-area input { flex: 1; min-width: 0; }

    </style>

</head>

<body>

<h1 th:text="${room.name}">
    채팅방 이름
</h1>

<a href="/main" style="flex:0 0 auto; margin-bottom:8px;">채팅 목록으로 돌아가기</a>

<hr>

<!-- 메시지 영역 -->

<div id="messageArea">

    <th:block th:each="message, status : ${messages}">
    <div class="date-divider"
         th:if="${status.first or #temporals.format(messages[status.index - 1].createdAt, 'yyyy.MM.dd') != #temporals.format(message.createdAt, 'yyyy.MM.dd')}"
         th:text="${#temporals.format(message.createdAt, 'yyyy.MM.dd')}">2026.09.28</div>
    <div class="message"
         th:attr="data-date=${#temporals.format(message.createdAt, 'yyyy.MM.dd')}"
         th:classappend="${message.user.username == currentUsername} ? ' my-message' : ' other-message'">
        <time class="message-time" th:if="${message.user.username == currentUsername}" th:text="${#temporals.format(message.createdAt, 'HH:mm')}">00:00</time>
        <div class="message-body">
            <span class="message-nickname" th:if="${message.user.username != currentUsername}" th:text="${message.user.nickname}">닉네임</span>
            <span class="message-bubble" th:text="${message.content}">메시지</span>
        </div>
        <time class="message-time" th:if="${message.user.username != currentUsername}" th:text="${#temporals.format(message.createdAt, 'HH:mm')}">00:00</time>

    </div>
    </th:block>

    <div
            th:if="${messages == null or messages.isEmpty()}"
            id="emptyMessage"
    >
        <p>아직 메시지가 없습니다.</p>
    </div>

</div>

<!-- 메시지 입력 -->

<div class="chat-input-area">

    <input
            type="text"
            id="messageInput"
            placeholder="메시지를 입력하세요."
            autocomplete="off"
    >

    <button
            type="button"
            id="sendButton"
    >
        전송
    </button>

</div>

<!-- WebSocket -->

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script th:inline="javascript">

    const roomId =
        /*[[${room.id}]]*/ 0;

    const currentUsername =
        /*[[${currentUsername}]]*/ '';

    const messageArea =
        document.getElementById("messageArea");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");


    // WebSocket 연결
    const socket =
        new SockJS("/ws");

    const stompClient =
        Stomp.over(socket);


    stompClient.connect({}, function () {

        console.log("WebSocket 연결 성공");


        // 현재 채팅방 구독
        stompClient.subscribe(
            "/topic/room/" + roomId,
            function (message) {

                const chatMessage =
                    JSON.parse(message.body);

                addMessage(chatMessage);

            }
        );

    });


    // 메시지 전송
    function sendMessage() {

        const content =
            messageInput.value.trim();

        if (content === "") {
            return;
        }


        stompClient.send(
            "/app/chat.send",
            {},
            JSON.stringify({

                roomId: roomId,

                content: content

            })
        );


        messageInput.value = "";

        messageInput.focus();

    }


    // 화면에 메시지 추가
    function addMessage(chatMessage) {

        const emptyMessage =
            document.getElementById("emptyMessage");

        if (emptyMessage) {
            emptyMessage.remove();
        }


        const messageDiv =
            document.createElement("div");

        messageDiv.classList.add("message");


        if (chatMessage.sender === currentUsername) {

            messageDiv.classList.add(
                "my-message"
            );

        } else {

            messageDiv.classList.add(
                "other-message"
            );

        }


        const messageDate = new Date(chatMessage.createdAt);
        const dateKey = [messageDate.getFullYear(), String(messageDate.getMonth() + 1).padStart(2, "0"), String(messageDate.getDate()).padStart(2, "0")].join(".");
        const messageList = messageArea.querySelectorAll(".message");
        const previousMessage = messageList.length ? messageList[messageList.length - 1] : null;
        if (dateKey !== previousMessage?.dataset.date) {
            const divider = document.createElement("div");
            divider.className = "date-divider";
            divider.textContent = dateKey;
            messageArea.appendChild(divider);
        }
        messageDiv.dataset.date = dateKey;
        const time = document.createElement("time");
        time.className = "message-time";
        time.textContent = `${String(messageDate.getHours()).padStart(2, "0")}:${String(messageDate.getMinutes()).padStart(2, "0")}`;
        const body = document.createElement("div");
        body.className = "message-body";
        if (chatMessage.sender === currentUsername) {
            messageDiv.appendChild(time);
        } else {
            const nickname = document.createElement("span");
            nickname.className = "message-nickname";
            nickname.textContent = chatMessage.nickname;
            body.appendChild(nickname);
        }
        const bubble = document.createElement("span");
        bubble.className = "message-bubble";
        bubble.textContent = chatMessage.content;
        body.appendChild(bubble);
        messageDiv.appendChild(body);
        if (chatMessage.sender !== currentUsername) {
            messageDiv.appendChild(time);
        }


        messageArea.appendChild(messageDiv);

    }


    // 버튼 클릭
    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // Enter 키
    messageInput.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );

</script>

</body>

</html>
